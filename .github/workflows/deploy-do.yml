name: Deploy Durable Objects

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 3. DEPLOY & SET SECRETS / VARS
      - name: Deploy to Cloudflare
        working-directory: apps/worker
        run: |
          # --- Core & AI Gateway Secrets ---
          echo "${{ secrets.AI_GATEWAY_TOKEN }}" | npx wrangler secret put AI_GATEWAY_TOKEN --env staging
          echo "$RUNTIME_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --env staging
          echo "${{ secrets.JULES_API_KEY }}" | npx wrangler secret put JULES_API_KEY --env staging

          # --- FEAT-04: Slack Review Bridge Secrets ---
          echo "${{ secrets.SLACK_BOT_TOKEN }}" | npx wrangler secret put SLACK_BOT_TOKEN --env staging
          echo "${{ secrets.SLACK_SIGNING_SECRET }}" | npx wrangler secret put SLACK_SIGNING_SECRET --env staging

          # --- Deploy Worker with Plain Config Variables ---
          npx wrangler deploy --env staging \
            --var GITHUB_DEFAULT_OWNER:"$DEFAULT_OWNER" \
            --var SLACK_CHANNEL_ID:"$SLACK_CHANNEL" \
            --var SLACK_AUTHORIZED_APPROVERS:"$SLACK_APPROVERS"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUNTIME_GITHUB_TOKEN: ${{ secrets.REPO_BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          DEFAULT_OWNER: ${{ vars.GITHUB_DEFAULT_OWNER || 'camp-candor' }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL_ID || '#ops-bridge' }}
          SLACK_APPROVERS: ${{ vars.SLACK_AUTHORIZED_APPROVERS || '' }}

      # 4. AUDIT
      - name: Run Live Audit
        run: npm run test:audit:staging --workspace=@camp_candor/agent
        env:
          STAGING_URL: https://repo-bot-00.berad4000.workers.dev