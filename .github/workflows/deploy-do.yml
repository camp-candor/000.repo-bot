name: Deploy Durable Objects

on:
    push:
        branches: [main]
        paths:
            - 'apps/**'
            - 'packages/**' # Trigger if types change too
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        name: Deploy
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            # 3. DEPLOY & SET SECRETS / VARS
            - name: Deploy to Cloudflare
              working-directory: apps/worker
              run: |
                  # 1. Pipe AI Gateway token to Cloudflare secret store
                  echo "${{ secrets.AI_GATEWAY_TOKEN }}" | npx wrangler secret put AI_GATEWAY_TOKEN --env staging

                  # 2. Pipe GitHub runtime token to Cloudflare secret store
                  echo "$RUNTIME_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --env staging

                  # 3. Pipe Jules API Key to Cloudflare secret store
                  echo "${{ secrets.JULES_API_KEY }}" | npx wrangler secret put JULES_API_KEY --env staging

                  # 4. Deploy Worker and pass non-sensitive GITHUB_DEFAULT_OWNER via --var
                  npx wrangler deploy --env staging --var GITHUB_DEFAULT_OWNER:"$DEFAULT_OWNER"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  RUNTIME_GITHUB_TOKEN: ${{ secrets.REPO_BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
                  DEFAULT_OWNER: ${{ vars.GITHUB_DEFAULT_OWNER || 'camp-candor' }}

            # 4. AUDIT
            - name: Run Live Audit
              run: npm run test:audit:staging --workspace=@camp_candor/agent
              env:
                  STAGING_URL: https://repo-bot-00.berad4000.workers.dev
